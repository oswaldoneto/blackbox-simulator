name: Instalador Windows

# Gera o instalador .exe numa máquina Windows.
# - Tag v* (ex.: v0.1.0): publica o instalador numa Release com o nome da tag.
# - Execução manual (Actions > Instalador Windows > Run workflow): só gera o
#   instalador e deixa como artefato da execução, sem criar Release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # O postinstall recompila o better-sqlite3 para o Electron.
      - run: npm ci

      - run: npm test

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Publicar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber
